name: Export KPI

# Refreshes public.kpi_sleeve_snapshots, then reads the scrubbed views.
# Path B: this Action does not call Robinhood and does not read ROBINHOOD_TOKEN.
# The kpi_trades sync runs only when a fills feed is present (workflow_dispatch
# input sync_rh_json, SYNC_RH_JSON, RH_FILLS_PATH, or data/rh_fills.json).
# No feed, including a missing ROBINHOOD_TOKEN, skips that step with exit 0.
# A requested feed that will not parse exits non-zero and stamps data/meta.json.
# A failed refresh does the same. Pull requests only self-test.
# Crypto sleeve only. Marks: public Coinbase ticker (crypto) and Yahoo chart (equities).
# FINNHUB_API_KEY, COINSTATS_API_KEY, and ALPHA_VANTAGE_API_KEY are optional.
# data/** pushes are ignored so the export commit does not run this job again.

on:
  schedule:
    # US cash session in both EDT and EST (about 9:30am–5:00pm ET), every 15 minutes.
    - cron: "*/15 13-21 * * 1-5"
    # Hourly outside that window, including weekends, so the crypto sleeve does not sit overnight.
    - cron: "7 0-12,22-23 * * 1-5"
    - cron: "7 * * * 0,6"
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  pull_request:
  workflow_dispatch:
    inputs:
      sync_rh_json:
        description: "Optional fills JSON or a path to it. Empty skips the RH sync. ROBINHOOD_TOKEN is not used."
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: sleeves-kpi-export
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Position math
        run: python3 scripts/refresh_kpi_snapshots.py --self-test

      - name: RH fill mapper
        run: python3 scripts/sync_rh_kpi_trades.py --self-test

  export:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync RH fills into kpi_trades
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SYNC_RH_JSON: ${{ github.event.inputs.sync_rh_json }}
        run: |
          python3 scripts/sync_rh_kpi_trades.py --self-test
          if [ -n "${SYNC_RH_JSON}" ] || [ -n "${RH_FILLS_PATH:-}" ] || [ -f data/rh_fills.json ]; then
            python3 scripts/sync_rh_kpi_trades.py
          else
            echo "No RH fills feed. ROBINHOOD_TOKEN is absent and is not required. Skipping kpi_trades sync."
          fi

      - name: Refresh kpi_sleeve_snapshots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          COINSTATS_API_KEY: ${{ secrets.COINSTATS_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python3 scripts/refresh_kpi_snapshots.py

      - name: Export scrubbed Supabase views
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KPI_REFRESH_EXPECTED: "1"
        run: python3 scripts/export_kpi.py

      - name: Commit refreshed JSON
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/kpi_summary.json data/kpi_trades_scrubbed.json data/models_oos.json data/meta.json
          if git diff --cached --quiet; then
            echo "KPI JSON unchanged."
          else
            git commit -m "Export scrubbed KPI views to data JSON"
            git push
          fi

      - name: Publish export failure on the board
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/meta.json
          if git diff --cached --quiet; then
            echo "No export status to publish. The board keeps the previous snapshot."
          else
            git commit -m "Mark KPI export stale"
            git push
          fi
